name: Deploy documentation to Pages

on:
  push:
    tags:
      - 'v*'
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - name: Setup scala-cli
        uses: VirtusLab/scala-cli-setup@v1
      - name: Generate documentation
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          # Override with a repo variable (Settings > Secrets and variables >
          # Actions > Variables > PROJECT_NAME) when the displayed project
          # name should differ from the repo slug, e.g. made -> "M&DE".
          PROJECT_NAME: ${{ vars.PROJECT_NAME || github.event.repository.name }}
        run: |
          scala-cli --power doc . --exclude benchmark -- \
          -project "$PROJECT_NAME" \
          -project-version ${{ github.ref_name }} \
          -project-footer "made with ❤️ and coffee" \
          -social-links:github::https://github.com/halotukozak/$REPO_NAME \
          -snippet-compiler:compile \
          -source-links:"src=github://halotukozak/$REPO_NAME?tag=${{ github.ref_name }}" \
          -revision:${{ github.ref_name }}

      # Scala 3.9.x's bundled scaladoc emits a ux.js that still calls jQuery's
      # `$.get` for SPA-style same-page navigation (sidebar/TOC link clicks) but
      # no longer loads jQuery, so every in-page link click throws
      # "ReferenceError: $ is not defined" right after the handler has already
      # called preventDefault(), and navigation silently breaks on the deployed
      # site. Fixed upstream in scala/scala3#26664 + scala/scala3#22014 (first
      # released in 3.10.0-RC1). Until these repos build on scaladoc >= 3.10.0,
      # swap the jQuery call for an equivalent native fetch(); the sed is a
      # no-op once the generated ux.js no longer contains the pattern.
      - name: Patch scaladoc jQuery navigation bug
        run: |
          sed -i 's/\$\.get(href, function (data) {/fetch(href).then((r) => r.text()).then(function (data) {/' \
            scala-doc/scripts/ux.js

      - name: Inject Umami analytics
        run: |
          find scala-doc -name '*.html' -exec sed -i \
            's#</head>#<script defer src="https://cloud.umami.is/script.js" data-website-id="f15f9eef-35ab-4b2a-ba14-f7e079e7de28"></script></head>#' {} +
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'scala-doc'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
